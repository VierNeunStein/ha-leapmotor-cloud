[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL"]
ignore = [
    "PLR0911", # many return statements
    "PLR0912", # many branches
    "PLR0913", # many arguments
    "PLR0915", # many statements
    "PLR0917", # many positional arguments
    "PLR2004", # magic values: signal ids and protocol codes
    "RUF001",
    "RUF002",
    "RUF003",
    "RUF012", # Home Assistant entities use mutable class attributes
    "ASYNC109",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components", "leapmotor_api"]
known-third-party = ["homeassistant", "pytest_homeassistant_custom_component"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLC0415", "E501"]
