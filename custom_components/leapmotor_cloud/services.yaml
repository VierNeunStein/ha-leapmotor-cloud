refresh:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud

set_climate:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud
    mode:
      default: fan
      selector:
        select:
          translation_key: climate_mode
          options:
            - heat
            - cool
            - fan
    temperature:
      default: 22
      selector:
        number:
          min: 18
          max: 32
          step: 1
          unit_of_measurement: "°C"
    fan_level:
      default: 4
      selector:
        number:
          min: 1
          max: 7
          step: 1
    recirculate:
      default: false
      selector:
        boolean:
    defrost:
      default: false
      selector:
        boolean:

set_charge_schedule:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud
    enabled:
      selector:
        boolean:
    start:
      selector:
        time:
    end:
      selector:
        time:
    limit:
      selector:
        number:
          min: 20
          max: 100
          step: 1
          unit_of_measurement: "%"

set_climate_schedule:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud
    start_time:
      required: true
      selector:
        datetime:
    days:
      selector:
        select:
          multiple: true
          translation_key: weekday
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    mode:
      default: fan
      selector:
        select:
          translation_key: climate_mode
          options:
            - heat
            - cool
            - fan
    temperature:
      default: 22
      selector:
        number:
          min: 18
          max: 32
          step: 1
          unit_of_measurement: "°C"
    fan_level:
      default: 4
      selector:
        number:
          min: 1
          max: 7
          step: 1
    recirculate:
      default: false
      selector:
        boolean:
    defrost:
      default: false
      selector:
        boolean:

cancel_climate_schedule:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud

prepare_car:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud
    climate:
      default: true
      selector:
        boolean:
    mode:
      default: fan
      selector:
        select:
          translation_key: climate_mode
          options:
            - heat
            - cool
            - fan
    temperature:
      default: 22
      selector:
        number:
          min: 18
          max: 32
          step: 1
          unit_of_measurement: "°C"
    fan_level:
      default: 4
      selector:
        number:
          min: 1
          max: 7
          step: 1
    recirculate:
      default: false
      selector:
        boolean:
    defrost:
      default: false
      selector:
        boolean:
    driver_seat:
      default: "off"
      selector:
        select:
          translation_key: seat_mode
          options:
            - "off"
            - heat
            - ventilation
    driver_seat_level:
      default: 3
      selector:
        number:
          min: 1
          max: 3
          step: 1
    passenger_seat:
      default: "off"
      selector:
        select:
          translation_key: seat_mode
          options:
            - "off"
            - heat
            - ventilation
    passenger_seat_level:
      default: 3
      selector:
        number:
          min: 1
          max: 3
          step: 1
    steering_wheel:
      default: false
      selector:
        boolean:
    mirrors:
      default: false
      selector:
        boolean:

send_destination:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud
    name:
      required: true
      example: "Berlin Hauptbahnhof"
      selector:
        text:
    latitude:
      required: true
      example: 52.5251
      selector:
        number:
          min: -90
          max: 90
          step: any
          mode: box
    longitude:
      required: true
      example: 13.3694
      selector:
        number:
          min: -180
          max: 180
          step: any
          mode: box
    address:
      example: "Europaplatz 1, 10557 Berlin"
      selector:
        text:

send_command:
  fields:
    device_id:
      selector:
        device:
          integration: leapmotor_cloud
    command_id:
      required: true
      example: 120
      selector:
        number:
          min: 100
          max: 999
          step: 1
          mode: box
    content:
      required: true
      example: '{"value": "true"}'
      selector:
        object:
    use_pin:
      default: true
      selector:
        boolean:
